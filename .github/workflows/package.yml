name: Package Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run pretest

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="${{ steps.package-version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version: $PACKAGE_VERSION"
            echo "tag version: $TAG_VERSION"
            exit 1
          fi

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Publish bundled Formatter
        run: node scripts/publish-formatter-runtime.mjs "${{ matrix.target }}"

      - name: Smoke test bundled Formatter
        run: node scripts/verify-formatter-runtime.mjs "${{ matrix.target }}"

      - name: Package target VSIX
        run: node scripts/package-vsix.mjs "${{ matrix.target }}"

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: csharp-workbench-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: dist/csharp-workbench-${{ needs.validate.outputs.version }}-${{ matrix.target }}.vsix
          if-no-files-found: error

  verify-package:
    needs: [validate, package]
    runs-on: ubuntu-latest

    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: csharp-workbench-${{ needs.validate.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify VSIX contents
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p unpacked

          verify_package() {
            TARGET="$1"
            EXECUTABLE="$2"
            OTHER_TARGET="$3"
            VSIX="dist/csharp-workbench-${VERSION}-${TARGET}.vsix"
            DESTINATION="unpacked/${TARGET}"

            test -f "$VSIX"
            mkdir -p "$DESTINATION"
            unzip -q "$VSIX" -d "$DESTINATION"

            ACTUAL_VERSION=$(node -p "require('./${DESTINATION}/extension/package.json').version")
            test "$ACTUAL_VERSION" = "$VERSION"
            grep -F "TargetPlatform=\"${TARGET}\"" "$DESTINATION/extension.vsixmanifest"
            test -f "$DESTINATION/extension/runtime/${TARGET}/${EXECUTABLE}"
            test ! -d "$DESTINATION/extension/runtime/${OTHER_TARGET}"
            test ! -d "$DESTINATION/extension/formatting/src"
            test ! -d "$DESTINATION/extension/formatting/tests"
          }

          verify_package "win32-x64" "CSharpWorkbench.Formatter.exe" "linux-x64"
          verify_package "linux-x64" "CSharpWorkbench.Formatter" "win32-x64"

          LINUX_VSIX="dist/csharp-workbench-${VERSION}-linux-x64.vsix"
          LINUX_ENTRY="extension/runtime/linux-x64/CSharpWorkbench.Formatter"
          LINUX_MODE=$(zipinfo -l "$LINUX_VSIX" "$LINUX_ENTRY" | awk -v entry="$LINUX_ENTRY" '$NF == entry { print $1 }')
          case "$LINUX_MODE" in
            *x*) ;;
            *)
              echo "Linux Formatter is not executable in the VSIX: mode=${LINUX_MODE:-missing}"
              exit 1
              ;;
          esac

          {
            echo "### VSIX package verification"
            echo
            echo "| Version | Target | Runtime executable | VSIX size (bytes) |"
            echo "| --- | --- | --- | ---: |"
            echo "| $VERSION | win32-x64 | CSharpWorkbench.Formatter.exe | $(stat -c%s "dist/csharp-workbench-${VERSION}-win32-x64.vsix") |"
            echo "| $VERSION | linux-x64 | CSharpWorkbench.Formatter | $(stat -c%s "dist/csharp-workbench-${VERSION}-linux-x64.vsix") |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, verify-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: csharp-workbench-${{ needs.validate.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" dist/*.vsix --clobber
